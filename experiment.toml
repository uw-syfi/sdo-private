# End-to-End Optimization Experiment Configuration

# Number of optimization iterations to run
# Iteration 1: Generates trajectories using Seed Prompts -> Optimizes -> Produces v1
# Iteration 2: Generates trajectories using v1 Prompts -> Optimizes -> Produces v2
# ...
iterations = 3

# List of prompts to optimize
# Available options:
# - deployer_system, deployer_fix_error, deployer_summarize, deployer_generate_script
# - code_analyzer_system, code_analyzer_user
# - monitor_analyze_health
# - agentflow_system, agentflow_user, agentflow_repair
prompts = [
    "deployer_fix_error",
    "deployer_generate_deploy_script",
    "deployer_generate_health_check",
    "deployer_system",
    "deployer_summarize",
    "deployer_generate_script",
    "code_analyzer_system",
    "code_analyzer_user"
]

[training]
# Applications to use for generating training trajectories
# These apps will be initialized in fresh environments for each iteration
apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/mediaMicroservices"
]

[validation]
# Applications to use for validation (optional)
# These run with the optimized prompts to verify performance on unseen apps
apps = [
    "apps/deathstarbench/socialNetwork"
]
