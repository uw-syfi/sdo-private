# RLM experiment — training set (hotelReservation + socialNetwork)
# Provider: rlm (Recursive Language Model — context stored in REPL, LLM queries programmatically)
# Hypothesis: lower token usage than baseline, especially on runs with many deployment iterations.
repeats = 3

apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/socialNetwork",
]

[agent]
backend = "rlm"
model = "vertex_ai/gemini-2.5-pro"
location = "us-central1"

[runtime]
impl = "cli_agent"

[operator]
interval = 30
monitoring_max_iters = 3
deployment_max_iters = 5

[deployment]
platform = "docker"
target = "local"

[dspy]
use_optimized = false
