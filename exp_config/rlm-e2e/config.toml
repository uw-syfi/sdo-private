iterations = 3
prompts = ["deployer_fix_error", "deployer_summarize", "rlm_deployer_fix_error"]
inter_run_delay = 30
max_retries = 3
rate_limit_backoff = 60
output_prefix = "rlm-e2e"
backend = "rlm"
model = "vertex_ai/gemini-2.5-pro"
work_dir = "exp_config/rlm-e2e/workdir"

[training]
apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/socialNetwork",
]

[validation]
apps = [
    "apps/fleetcast",
]
