# Hybrid experiment — training set (hotelReservation + socialNetwork)
# Provider: hybrid (4 subagent pre-analyses injected into RLM REPL, then full RLM loop)
# Expected: best accuracy + moderate token savings vs baseline; more tokens than pure RLM.
repeats = 3

apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/socialNetwork",
]

[agent]
provider = "hybrid"
model = "vertex_ai/gemini-2.5-pro"
location = "us-central1"

[runtime]
impl = "cli_agent"

[operator]
interval = 30
monitoring_max_iters = 3
deployment_max_iters = 20

[deployment]
platform = "docker"
target = "local"

[dspy]
use_optimized = false
