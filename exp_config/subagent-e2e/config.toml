iterations = 3
prompts = ["deployer_fix_error", "deployer_summarize", "subagent_trajectory_analyst", "subagent_error_log_analyst", "subagent_script_analyst", "subagent_repo_analyst", "subagent_root_synthesis"]
inter_run_delay = 30
max_retries = 3
rate_limit_backoff = 60
output_prefix = "subagent-e2e"
backend = "subagent"
model = "vertex_ai/gemini-2.5-pro"
work_dir = "exp_config/subagent-e2e/workdir"

[training]
apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/socialNetwork",
]

[validation]
apps = [
    "apps/fleetcast",
]
