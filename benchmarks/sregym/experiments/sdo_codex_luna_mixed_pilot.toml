# Learning-curve stream, SDO arm: 10 Hotel Reservation incidents from seed 20261002,
# answered by ONE long-running SDO controller (Codex gpt-6-luna) in
# hotel-reservation-sdo. Stage 0 starts from a fresh application workspace (cold
# lifecycle); every later stage chains the workspace, so each incident sees the
# detectors, playbooks and outcomes learned before it. Strict receipts are
# required and are written after each incident's reflection drains.
# Generated by benchmarks.sregym.runner.incident_stream; do not edit by hand.
# Settings otherwise copied from sdo_codex_luna_persistent.toml; images are the
# private `mi7` build (mixed-integration: validator-image, lifecycle-guard,
# close-out gate, prober-warm, attribution-clock, link-coverage backstop, the
# verifier late-findings fix, and the responder evidence-kind discipline fix) so
# the shared v0.1.0 tags stay untouched. The SDO
# agent_config enables the operational flags the mixed stream needs: late-findings
# pull, healthy baseline, and the close-out state gate.
# Baseline (identical incidents): codex_luna_stream_baseline_*.toml.
#
# Stream (kind: first/novel = no applicable memory, exact = repeat, variant = same
# root cause with other parameters):
#    1  first    missing_configmap_hotel_reservation
#    2  first    wrong_service_selector_hotel_reservation
#    3  variant  missing_configmap_mongodb_geo_rate_hotel_reservation
#    4  first    readiness_probe_misconfiguration_hotel_reservation
#    5  first    network_policy_block
#    6  novel    misconfig_app_hotel_res
#    7  composite composite3_hotel_geo_rate_recommendation
#    8  variant  readiness_probe_misconfiguration__v_hotel_reservation_reservation
#    9  exact    misconfig_app_hotel_res
#   10  exact    composite3_hotel_geo_rate_recommendation
#
# composite = first occurrence of a multi-fault composite; every component class has already
# appeared as a single fault. Its repeats are exact, its other target mixes are variants.

[pipeline]
name = "sdo-codex-luna-mixed-pilot"

[defaults]
agent = "sdo_codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
require_strict_receipt = true
allow_failed_verdicts = true  # a stream must continue past an incident graded as failed

[defaults.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane (topology measurement, 2026-09-28)
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
fast_namespace_teardown = true  # skips pod termination grace between incidents; outside every measured window
cleanup_defer_timeout_seconds = 4200
docker_builder = "sdo-example"

[defaults.variants]
enabled = false

[defaults.agent_config.sdo_codex]
backend = "agent-cli"
provider = "codex"
model = "gpt-6-luna"
timeout_sec = 3600
controller_image = "sdo-controller:mi7"
responder_image = "sdo-sregym-responder:mi7"
validator_image = "sdo-detector-validator:mi7"
credentials_secret = "sdo-agent-credentials"
persistent_controller = true
reflection_session = "fresh"
reflection_guidance = "generalize"
late_findings = "pull"
max_follow_ups = 3
follow_up_cooldown_seconds = 30
healthy_baseline = true
closeout_state_gate = true

[[stages]]
name = "i01-first-missing-configmap-hotel-reservation"
chain_kb = false
chain_application_workspace = false

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]

[[stages]]
name = "i02-first-wrong-service-selector-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["wrong_service_selector_hotel_reservation"]

[[stages]]
name = "i03-variant-missing-configmap-mongodb-geo-rate-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["missing_configmap_mongodb_geo_rate_hotel_reservation"]

[[stages]]
name = "i04-first-readiness-probe-misconfiguration-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["readiness_probe_misconfiguration_hotel_reservation"]

[[stages]]
name = "i05-first-network-policy-block"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["network_policy_block"]

[[stages]]
name = "i06-novel-misconfig-app-hotel-res"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["misconfig_app_hotel_res"]

[[stages]]
name = "i07-composite-composite3-hotel-geo-rate-recommendation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["composite3_hotel_geo_rate_recommendation"]

[[stages]]
name = "i08-variant-readiness-probe-misconfiguration--v-hotel-reservation-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["readiness_probe_misconfiguration__v_hotel_reservation_reservation"]

[[stages]]
name = "i09-exact-misconfig-app-hotel-res"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["misconfig_app_hotel_res"]

[[stages]]
name = "i10-exact-composite3-hotel-geo-rate-recommendation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["composite3_hotel_geo_rate_recommendation"]
