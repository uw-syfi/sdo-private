[runner]
agent = "codex"
model = "gpt-5.5"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
enable_summary = false
no_inject_summary = true
problems = ["faulty_image_correlated"]

[runner.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "16"
reuse_cluster = true

[agent.codex]
verify_protocol = "none"  # pin stock (2026-09-28): the Codex baseline now defaults to "concise" verify
