# Four sequential, source-backed Hotel Reservation incidents exercising the
# durable SDO -> Codex -> independent verdict -> outcome -> reflection loop.
#
# `incorrect_image` is intentionally not included: SREGym binds it to
# Astronomy Shop, whose source-deploy adapter is explicitly unsupported.
# `readiness_probe_misconfiguration_hotel_reservation` substitutes a distinct
# probe/configuration failure while keeping every stage source-deployable.

[pipeline]
name = "sdo-codex-four-e2e"

[defaults]
agent = "sdo_codex"
model = "gpt-5.4"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
require_strict_receipt = true

[defaults.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
reuse_cluster = true
cleanup_defer_timeout_seconds = 1800

[defaults.variants]
enabled = false

[defaults.agent_config.sdo_codex]
model = "gpt-5.4"
timeout_sec = 1800
terminal_timeout_sec = 300
reflection_timeout_sec = 900

[[stages]]
name = "readiness-probe"
chain_kb = false
chain_application_workspace = false

[stages.runner]
problems = ["readiness_probe_misconfiguration_hotel_reservation"]

[[stages]]
name = "missing-configmap"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]

[[stages]]
name = "wrong-service-selector"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["wrong_service_selector_hotel_reservation"]

[[stages]]
name = "network-policy-block"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["network_policy_block"]
