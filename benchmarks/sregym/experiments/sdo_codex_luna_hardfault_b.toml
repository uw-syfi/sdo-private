# Hard-fault stream (run B, S-first): S1 N1 S2 N2 S3 N3 S4 N4.
# N = network_policy_block (recommendation), S = wrong_service_selector_hotel_reservation (frontend). Only one variant is
# registered per family, so repeats are exact repeats (see docs/hard-fault-stream-decisions.md).
# Arm: reflection_guidance = "generalize", reflection_session = "fresh", persistent controller, Codex gpt-6-luna agent + judge.
# Images: private `hf1` build. Seed: lifecycle-only workspace (SREGYM_APP_WORKSPACE_SEED_DIR), no incident memory at start.
# Launch: see docs/hard-fault-stream-decisions.md (Calico NetworkPolicy bootstrap env is required for N).

[pipeline]
name = "sdo-codex-luna-hardfault-b"

[defaults]
agent = "sdo_codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
require_strict_receipt = true
allow_failed_verdicts = true  # a stream must continue past an incident graded as failed

[defaults.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane (topology measurement, 2026-09-28)
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
fast_namespace_teardown = true  # skips pod termination grace between incidents; outside every measured window
cleanup_defer_timeout_seconds = 4200
docker_builder = "sdo-example"

[defaults.variants]
enabled = false

[defaults.agent_config.sdo_codex]
backend = "agent-cli"
provider = "codex"
model = "gpt-6-luna"
timeout_sec = 3600
controller_image = "sdo-controller:hf1"
responder_image = "sdo-sregym-responder:hf1"
validator_image = "sdo-detector-validator:hf1"
credentials_secret = "sdo-agent-credentials"
persistent_controller = true
reflection_session = "fresh"
reflection_guidance = "generalize"

[[stages]]
name = "i01-s1-wrong-service-selector-hotel-reservation"
chain_kb = false
chain_application_workspace = false

[stages.runner]
problems = ["wrong_service_selector_hotel_reservation"]

[[stages]]
name = "i02-n1-network-policy-block"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["network_policy_block"]

[[stages]]
name = "i03-s2-wrong-service-selector-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["wrong_service_selector_hotel_reservation"]

[[stages]]
name = "i04-n2-network-policy-block"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["network_policy_block"]

[[stages]]
name = "i05-s3-wrong-service-selector-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["wrong_service_selector_hotel_reservation"]

[[stages]]
name = "i06-n3-network-policy-block"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["network_policy_block"]

[[stages]]
name = "i07-s4-wrong-service-selector-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["wrong_service_selector_hotel_reservation"]

[[stages]]
name = "i08-n4-network-policy-block"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["network_policy_block"]
