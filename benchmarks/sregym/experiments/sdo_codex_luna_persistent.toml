# Two identical source-backed incidents answered by ONE long-running SDO
# controller (Codex gpt-6-luna). Stage 0 installs the controller in its own
# namespace (hotel-reservation-sdo); stage 1 reuses the same controller pod,
# skipping the per-round install, lifecycle revalidation, and controller build.
# The controller's repository is the source of truth; the host workspace chain
# still receives it after each reflection drain. Strict receipts are written
# after each incident's reflection drains (next stage or pipeline teardown).

[pipeline]
name = "sdo-codex-luna-persistent"

[defaults]
agent = "sdo_codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
require_strict_receipt = true

[defaults.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane (topology measurement, 2026-09-28)
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
cleanup_defer_timeout_seconds = 4200
docker_builder = "sdo-example"

[defaults.variants]
enabled = false

[defaults.agent_config.sdo_codex]
backend = "agent-cli"
provider = "codex"
model = "gpt-6-luna"
timeout_sec = 3600
controller_image = "sdo-controller:v0.1.0"
responder_image = "sdo-sregym-responder:v0.1.0"
validator_image = "sdo-detector-validator:v0.1.0"
credentials_secret = "sdo-agent-credentials"
persistent_controller = true

[[stages]]
name = "first-incident"
chain_kb = false
chain_application_workspace = false

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]

[[stages]]
name = "reused-incident"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]
