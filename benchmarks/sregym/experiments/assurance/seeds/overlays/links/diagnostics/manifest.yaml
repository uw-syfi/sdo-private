apiVersion: sdo.dev/v1alpha1
kind: DetectorManifest
sdkVersion: v0.1
detectors:
  - id: health-objective
    package: ./detectors/health/objective
    constructor: New
    class: health
    owner: health_judge
    watches:
      - apiVersion: v1
        kind: Pod
      - apiVersion: v1
        kind: ConfigMap
      - apiVersion: v1
        kind: Service
      - apiVersion: apps/v1
        kind: Deployment
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
      - apiVersion: v1
        kind: Endpoints
      - apiVersion: discovery.k8s.io/v1
        kind: EndpointSlice
    interval: 30s
    persistence:
      firing: 2
      clearing: 2
    batching:
      severity: critical
      debounce: 500ms
    possiblePlaybooks:
      - .sdo/playbooks/health-objective/README.md
    originatingCommit: lifecycle-bootstrap
  # BEGIN lifecycle-installed health detector service-endpoints
  - id: service-endpoints
    package: ./detectors/health/service-endpoints
    constructor: New
    class: health
    owner: health_judge
    watches:
      - apiVersion: v1
        kind: Service
      - apiVersion: v1
        kind: Endpoints
      - apiVersion: v1
        kind: Pod
      - apiVersion: apps/v1
        kind: Deployment
    interval: 15s
    persistence:
      firing: 2
      clearing: 2
    batching:
      severity: critical
      debounce: 500ms
    possiblePlaybooks:
      - .sdo/playbooks/health-objective/README.md
    originatingCommit: lifecycle-bootstrap
  # END lifecycle-installed health detector service-endpoints
  # BEGIN lifecycle-installed health detector traffic-health
  - id: traffic-health
    package: ./detectors/health/traffic-health
    constructor: New
    class: health
    owner: health_judge
    watches:
      - apiVersion: sdo.dev/v1alpha1
        kind: SyntheticTraffic
    interval: 10s
    persistence:
      firing: 2
      clearing: 2
    batching:
      severity: critical
      debounce: 500ms
    possiblePlaybooks:
      - .sdo/playbooks/health-objective/README.md
    originatingCommit: lifecycle-bootstrap
  # END lifecycle-installed health detector traffic-health
  # BEGIN lifecycle-installed health detector traffic-links
  - id: traffic-links
    package: ./detectors/health/traffic-links
    constructor: New
    class: health
    owner: health_judge
    watches:
      - apiVersion: sdo.dev/v1alpha1
        kind: SyntheticTraffic
    interval: 10s
    persistence:
      firing: 2
      clearing: 2
    batching:
      severity: critical
      debounce: 500ms
    possiblePlaybooks:
      - .sdo/playbooks/health-objective/README.md
    originatingCommit: lifecycle-bootstrap
  # END lifecycle-installed health detector traffic-links
