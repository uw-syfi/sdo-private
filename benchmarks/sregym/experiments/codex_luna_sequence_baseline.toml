# Memoryless stock Codex baseline for the SDO luna sequence comparison
# (sdo_codex_luna_sequence.toml). Codex keeps no memory between problems, so the
# A B C D A B C D sequence is covered by running this A B C D config twice, each
# in a new log dir; the analysis script averages Codex per problem. (Inline
# problem lists are de-duplicated by the runner, and runner `repeat` is not
# accepted by SREGym main.py, so the list cannot repeat problems itself.)
# Settings copied from codex_luna_baseline.toml.

[runner]
agent = "codex"
model = "gpt-6-luna"
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
enable_summary = false
no_inject_summary = true
problems = [
    "readiness_probe_misconfiguration_hotel_reservation",
    "missing_configmap_hotel_reservation",
    "wrong_service_selector_hotel_reservation",
    "network_policy_block",
]

[runner.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
docker_builder = "sdo-example"
