# Learning-curve stream, SDO arm: 8 Hotel Reservation incidents from seed 20260930,
# answered by ONE long-running SDO controller (Codex gpt-6-luna) in
# hotel-reservation-sdo. Stage 0 starts from a fresh application workspace (cold
# lifecycle); every later stage chains the workspace, so each incident sees the
# detectors, playbooks and outcomes learned before it. Strict receipts are
# required and are written after each incident's reflection drains.
# Generated by benchmarks.sregym.runner.incident_stream; do not edit by hand.
# Settings otherwise copied from sdo_codex_luna_persistent.toml; images are the
# private `stream1` build so the shared v0.1.0 tags stay untouched.
# Baseline (identical incidents): codex_luna_stream_baseline_*.toml.
#
# Stream (kind: first/novel = no applicable memory, exact = repeat, variant = same
# root cause with other parameters):
#    1  first    network_policy_block
#    2  first    missing_configmap_hotel_reservation
#    3  first    readiness_probe_misconfiguration_hotel_reservation
#    4  exact    network_policy_block
#    5  novel    misconfig_app_hotel_res
#    6  variant  readiness_probe_misconfiguration__v_hotel_reservation_geo
#    7  exact    missing_configmap_hotel_reservation
#    8  first    wrong_service_selector_hotel_reservation

[pipeline]
name = "sdo-codex-luna-stream-pilot"

[defaults]
agent = "sdo_codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
require_strict_receipt = true

[defaults.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane (topology measurement, 2026-09-28)
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
fast_namespace_teardown = true  # skips pod termination grace between incidents; outside every measured window
cleanup_defer_timeout_seconds = 4200
docker_builder = "sdo-example"

[defaults.variants]
enabled = false

[defaults.agent_config.sdo_codex]
backend = "agent-cli"
provider = "codex"
model = "gpt-6-luna"
timeout_sec = 3600
controller_image = "sdo-controller:stream1"
responder_image = "sdo-sregym-responder:stream1"
validator_image = "sdo-detector-validator:stream1"
credentials_secret = "sdo-agent-credentials"
persistent_controller = true

[[stages]]
name = "i01-first-network-policy-block"
chain_kb = false
chain_application_workspace = false

[stages.runner]
problems = ["network_policy_block"]

[[stages]]
name = "i02-first-missing-configmap-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]

[[stages]]
name = "i03-first-readiness-probe-misconfiguration-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["readiness_probe_misconfiguration_hotel_reservation"]

[[stages]]
name = "i04-exact-network-policy-block"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["network_policy_block"]

[[stages]]
name = "i05-novel-misconfig-app-hotel-res"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["misconfig_app_hotel_res"]

[[stages]]
name = "i06-variant-readiness-probe-misconfiguration--v-hotel-reservation-geo"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["readiness_probe_misconfiguration__v_hotel_reservation_geo"]

[[stages]]
name = "i07-exact-missing-configmap-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]

[[stages]]
name = "i08-first-wrong-service-selector-hotel-reservation"
chain_kb = false
chain_application_workspace = true

[stages.runner]
problems = ["wrong_service_selector_hotel_reservation"]
