# Memoryless stock Codex baseline for the learning-curve stream (incidents 9-24). Lists the
# same incidents, in the same order, as sdo_codex_luna_stream.toml (seed 20260930).
# Codex keeps no memory between problems, so each run is an independent sample and
# splitting the stream over two configs changes nothing. Settings copied from
# codex_luna_sequence_baseline.toml (NOT the verify variant).
# Generated by benchmarks.sregym.runner.incident_stream; do not edit by hand.
#
#    9  exact    readiness_probe_misconfiguration__v_hotel_reservation_geo
#   10  variant  readiness_probe_misconfiguration__v_hotel_reservation_reservation
#   11  exact    network_policy_block
#   12  exact    missing_configmap_hotel_reservation
#   13  exact    readiness_probe_misconfiguration__v_hotel_reservation_geo
#   14  variant  readiness_probe_misconfiguration__v_hotel_reservation_recommendation
#   15  variant  missing_configmap_mongodb_geo_rate_hotel_reservation
#   16  novel    wrong_dns_policy_hotel_reservation
#   17  variant  readiness_probe_misconfiguration__v_hotel_reservation_search
#   18  exact    readiness_probe_misconfiguration_hotel_reservation
#   19  exact    network_policy_block
#   20  variant  readiness_probe_misconfiguration__v_hotel_reservation_profile
#   21  exact    wrong_service_selector_hotel_reservation
#   22  variant  missing_configmap_mongodb_rate_hotel_reservation
#   23  exact    readiness_probe_misconfiguration__v_hotel_reservation_search
#   24  variant  readiness_probe_misconfiguration__v_hotel_reservation_user

[runner]
agent = "codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
enable_summary = false
no_inject_summary = true
problems = [
    "readiness_probe_misconfiguration__v_hotel_reservation_geo",
    "readiness_probe_misconfiguration__v_hotel_reservation_reservation",
    "network_policy_block",
    "missing_configmap_hotel_reservation",
    "readiness_probe_misconfiguration__v_hotel_reservation_geo",
    "readiness_probe_misconfiguration__v_hotel_reservation_recommendation",
    "missing_configmap_mongodb_geo_rate_hotel_reservation",
    "wrong_dns_policy_hotel_reservation",
    "readiness_probe_misconfiguration__v_hotel_reservation_search",
    "readiness_probe_misconfiguration_hotel_reservation",
    "network_policy_block",
    "readiness_probe_misconfiguration__v_hotel_reservation_profile",
    "wrong_service_selector_hotel_reservation",
    "missing_configmap_mongodb_rate_hotel_reservation",
    "readiness_probe_misconfiguration__v_hotel_reservation_search",
    "readiness_probe_misconfiguration__v_hotel_reservation_user",
]

[runner.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane (topology measurement, 2026-09-28)
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
fast_namespace_teardown = true  # skips pod termination grace between incidents; outside every measured window
docker_builder = "sdo-example"
