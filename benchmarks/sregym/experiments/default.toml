# Default SREGym experiment configuration.
#
# Usage:
#   bash scripts/run_sregym.sh benchmarks/sregym/experiments/default.toml  # new run
#   bash scripts/run_sregym.sh third_party/sregym/logs/<exp-dir>/  # resume

[runner]
agent = "crucible"
model = "google-vertex:gemini-2.5-flash"
#model = "google_vertexai:gemini-2.5-flash"
parallel = 1
enable_summary = true
no_inject_summary = false
# repeat = 1  # independent attempts per problem (SREGym --n-attempts), not retries
# sequence_len = 0
# sequence_seed = 42

# Problem selection (mutually exclusive with [runner.variants]):
#
# Named pre-built set (maps to third_party/sregym/sregym/conductor/tasklist.<name>.yml):
# tasklist = "count_train"
#
# Path to a custom tasklist YAML:
# tasklist = "exp_config/sregym/my_tasklist.yml"
#
# Inline list of specific problem IDs (all get diagnosis+mitigation):
# problems = [
#     "faulty_image_correlated",
#     "incorrect_port_assignment",
# ]
#
# Filter by spec/category prefix (matches IDs equal to or starting with "<spec>_"):
# spec_names = ["service_dns_resolution_failure"]

[runner.variants]
enabled = true
count = 10
offset = 0
seed = 42
order = "grouped"  # one of: flat | round_robin | grouped | adaptive
max_per_class = 10      # valid when order = "grouped" or "adaptive"
# spec_names = ["liveness_probe_misconfiguration"]
spec_names = ["service_dns_resolution_failure"]

# Adaptive mode example (KB curation): keep feeding a class until the agent
# reliably solves it, then advance.
#
# order = "adaptive"
# spec_names = ["wrong_dns_policy"]
# max_per_class = 20         # X: hard cap per class
# consec_solves_to_stop = 3  # N: stop class after N consecutive full solves
# seed = 42
# # count = 50               # global cap: stop after 50 total problems (0 = no cap)

[runner.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
#crucible_seed_kb_dir = "/path/to/sdo/third_party/sregym/logs/20260331_012038_crucible_no_kb/kb"
# crucible_seed_kb_dir = "/path/to/sdo/third_party/sregym/logs/20260406_233420_crucible/kb"
crucible_seed_kb_dir = ""
worker_cpu_limit = "16"

# Reuse the per-worker kind cluster (sregym-w{id}) across run_sregym.sh
# invocations instead of deleting + recreating it on each worker startup.
# Skips ~30s of kind teardown/bring-up plus the multi-GB infra image re-pull.
# Falls back to a full recreate if the cluster is missing or unhealthy.
# Override at the CLI with SREGYM_REUSE_CLUSTER=1, or force a full recreate
# (even when reuse_cluster=true) with SREGYM_FORCE_RECREATE_CLUSTER=1.
# To manually nuke a stuck cluster: `kind delete cluster --name sregym-w0`
# reuse_cluster = true

# Agent-specific config.
[agent.crucible]
prompt_version = "v3"
enable_judge = false
enable_ltm_retrieval = true
max_hypotheses = 3
max_submissions = 3
kb_type = "structured"
include_benchmark_results = true
enable_reflection = true
inject_heuristics = true
include_incident_files = true
per_app = false
max_diagnosis_iterations = 3
max_mitigation_iterations = 3
wait_stage_timeout = 300
enable_playbooks = true
recovery_phase2_enabled = true
enable_ltm_verified_direct_submit = true
enable_playbook_shortcut = true
