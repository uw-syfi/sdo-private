# Learning-curve stream, SDO arm: 24 Hotel Reservation incidents from seed 20261002,
# answered by ONE long-running SDO controller (Codex gpt-6-luna) in
# hotel-reservation-sdo. Stage 0 starts from a fresh application workspace (cold
# lifecycle); every later stage chains the workspace, so each incident sees the
# detectors, playbooks and outcomes learned before it. Strict receipts are
# required and are written after each incident's reflection drains.
# Generated by benchmarks.sregym.runner.incident_stream; do not edit by hand.
# Settings otherwise copied from sdo_codex_luna_persistent.toml; images are the
# private `stream1` build so the shared v0.1.0 tags stay untouched.
# Baseline (identical incidents): codex_luna_stream_baseline_*.toml.
#
# Stream (kind: first/novel = no applicable memory, exact = repeat, variant = same
# root cause with other parameters):
#    1  first    missing_configmap_hotel_reservation
#    2  first    wrong_service_selector_hotel_reservation
#    3  variant  missing_configmap_mongodb_geo_rate_hotel_reservation
#    4  first    readiness_probe_misconfiguration_hotel_reservation
#    5  first    network_policy_block
#    6  novel    misconfig_app_hotel_res
#    7  composite composite3_hotel_geo_rate_recommendation
#    8  variant  readiness_probe_misconfiguration__v_hotel_reservation_reservation
#    9  exact    misconfig_app_hotel_res
#   10  exact    composite3_hotel_geo_rate_recommendation
#   11  variant  composite3c_hotel_rate_mongodb_geo_user
#   12  variant  composite3b_hotel_profile_mongodb_geo_recommendation
#   13  composite composite4_hotel_profile_rate_recommendation_frontend
#   14  exact    composite3b_hotel_profile_mongodb_geo_recommendation
#   15  variant  readiness_probe_misconfiguration__v_hotel_reservation_user
#   16  variant  readiness_probe_misconfiguration__v_hotel_reservation_search
#   17  exact    readiness_probe_misconfiguration__v_hotel_reservation_reservation
#   18  variant  missing_configmap_mongodb_rate_hotel_reservation
#   19  exact    composite3_hotel_geo_rate_recommendation
#   20  exact    wrong_service_selector_hotel_reservation
#   21  exact    missing_configmap_mongodb_rate_hotel_reservation
#   22  novel    wrong_dns_policy_hotel_reservation
#   23  variant  readiness_probe_misconfiguration__v_hotel_reservation_profile
#   24  exact    composite3c_hotel_rate_mongodb_geo_user
#
# composite = first occurrence of a multi-fault composite; every component class has already
# appeared as a single fault. Its repeats are exact, its other target mixes are variants.

[pipeline]
name = "sdo-codex-luna-mixed-stream"

[defaults]
agent = "sdo_codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
require_strict_receipt = true
allow_failed_verdicts = true  # a stream must continue past an incident graded as failed

[defaults.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane (topology measurement, 2026-09-28)
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
fast_namespace_teardown = true  # skips pod termination grace between incidents; outside every measured window
cleanup_defer_timeout_seconds = 4200
docker_builder = "sdo-example"

[defaults.variants]
enabled = false

[defaults.agent_config.sdo_codex]
backend = "agent-cli"
provider = "codex"
model = "gpt-6-luna"
timeout_sec = 3600
controller_image = "sdo-controller:stream1"
responder_image = "sdo-sregym-responder:stream1"
validator_image = "sdo-detector-validator:stream1"
credentials_secret = "sdo-agent-credentials"
persistent_controller = true

[[stages]]
name = "i01-first-missing-configmap-hotel-reservation"
chain_kb = false
chain_application_workspace = false

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]

