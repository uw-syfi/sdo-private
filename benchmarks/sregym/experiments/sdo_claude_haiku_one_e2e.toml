# One source-backed incident exercising the complete production SDO path with
# Claude Code Haiku, recorded live actions, brokered commits, and strict receipt.

[runner]
agent = "sdo_codex"
model = "haiku"
parallel = 1
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
enable_summary = false
no_inject_summary = true
problems = ["missing_configmap_hotel_reservation"]
require_strict_receipt = true

[runner.env]
judge_model_id = "vertex_ai/gemini-2.5-pro"
worker_cpu_limit = "3"
reuse_cluster = true
force_recreate_cluster = false
cleanup_defer_timeout_seconds = 4200

[agent.sdo_codex]
backend = "agent-cli"
provider = "claude"
model = "haiku"
timeout_sec = 3600
controller_image = "sdo-controller:v0.1.0"
responder_image = "sdo-sregym-responder:v0.1.0"
validator_image = "sdo-detector-validator:v0.1.0"
credentials_secret = "sdo-agent-credentials"
