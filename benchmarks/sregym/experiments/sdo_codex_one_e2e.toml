# One source-backed incident exercising the SDO lifecycle, Go controller,
# agent-cli Codex responder, commit broker, reflection, and strict receipt.

[runner]
agent = "sdo_codex"
model = "gpt-5.4"
parallel = 1
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
enable_summary = false
no_inject_summary = true
problems = ["missing_configmap_hotel_reservation"]
require_strict_receipt = true

[runner.env]
judge_model_id = "vertex-ai-gemini-2.5-pro"
worker_cpu_limit = "3"
reuse_cluster = true
force_recreate_cluster = false
cleanup_defer_timeout_seconds = 4200

[agent.sdo_codex]
backend = "agent-cli"
provider = "codex"
model = "gpt-5.4"
timeout_sec = 3600
controller_image = "sdo-controller:v0.1.0"
responder_image = "sdo-sregym-responder:v0.1.0"
validator_image = "sdo-detector-validator:v0.1.0"
