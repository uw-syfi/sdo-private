# Test fixture only: the traffic mix a health judge is expected to derive from
# DeathStarBench Hotel Reservation's frontend (services/frontend/server.go)
# and its seeded users (cmd/user/db.go names user i "Cornell_<hex of the
# digits of i>" with password "<i> repeated ten times"). SDO source never
# carries application routes; the lifecycle authors them per application.
apiVersion: sdo.dev/v1alpha1
kind: TrafficMix
name: frontend
description: Hotel Reservation user paths served by the frontend Service.
target:
  service: frontend
  port: 5000
ratePerSecond: 4
timeout: 2s
routes:
  - id: search
    method: GET
    path: /hotels
    query:
      inDate: "2015-04-09"
      outDate: "2015-04-10"
      lat: "37.7867"
      lon: "-122.4112"
  - id: recommend
    method: GET
    path: /recommendations
    query:
      require: rate
      lat: "37.7867"
      lon: "-122.4112"
  - id: login
    method: GET
    path: /user
    query:
      username: Cornell_31
      password: "1111111111"
    expect:
      bodyContains: Login successfully!
  # A zero-room reservation on a far-future date is capacity-neutral: the
  # reservation service counts rooms per date, so repeating it never exhausts
  # a hotel or changes what the benchmark workload (2015 dates) can book.
  - id: reserve
    method: POST
    path: /reservation
    query:
      inDate: "2099-01-01"
      outDate: "2099-01-02"
      hotelId: "1"
      customerName: sdo-synthetic
      username: Cornell_31
      password: "1111111111"
      number: "0"
    mutates: true
    dataPolicy: idempotent
    syntheticMarker: sdo-synthetic
    expect:
      bodyContains: Reserve successfully!
