[project]
name = "sds-app-operator"
version = "0.1.0"
description = "Application deployment and monitoring operator"
requires-python = ">=3.10"
dependencies = [
    "agentshim>=0.2.0",
    "sds-core",
    "llm-rt",
    "langchain-openai>=1.1.6",
    "langchain-anthropic>=0.1.20",
    "langchain-google-genai>=4.0.0",

    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "jinja2>=3.1.0",
    "click>=8.0.0",
    "dspy-ai>=2.4.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
]

[tool.uv.sources]
agentshim = { git = "https://github.com/vic-lsh/agentshim", rev = "012fbf5aa42fc116643903ff851c11ab8facd814" }
sds-core = { workspace = true }
llm-rt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]
