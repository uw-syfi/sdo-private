[project]
name = "sds-app-operator"
version = "0.1.0"
description = "Application deployment and monitoring operator"
requires-python = ">=3.10"
dependencies = [
    "sds-agent-cli",
    "sds-core",

    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "jinja2>=3.1.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
]

[tool.uv.sources]
sds-agent-cli = { workspace = true }
sds-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]
