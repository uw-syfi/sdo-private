# Experiment opt2: Train-Ticket in Training Set
# Tests how train-ticket trajectories influence prompt optimization

iterations = 3
output_prefix = "opt2"  # Write to optimized/opt2/ instead of optimized/

# Rate limiting - staggered timing to avoid conflicts
inter_run_delay = 45
max_retries = 3
rate_limit_backoff = 60

# Focus on most impactful prompts
prompts = [
    "deployer_fix_error",
    "deployer_summarize"
]

[training]
# Including train-ticket to see how it affects optimization
apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/mediaMicroservices",
    "apps/train-ticket"
]

[validation]
# Validate on socialNetwork
apps = [
    "apps/deathstarbench/socialNetwork"
]
