[project]
name = "sds-pydantic-agent"
version = "0.1.0"
description = "Generic pydantic-ai BaseAgent with composable middleware"
requires-python = ">=3.10"
dependencies = ["pydantic-ai>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/pydantic_agent"]
