[project]
name = "sds-sregym-lib"
version = "0.1.0"
description = "Shared SREGym launcher + conductor-client library for SREGym agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/sregym_lib"]
