[project]
name = "llm-rt"
version = "0.1.0"
description = "Shared LiteLLM runtime helpers for SDS"
requires-python = ">=3.10"
dependencies = [
    "agentshim>=0.2.0",
    "litellm>=1.0.0",
    "loguru>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/llm_rt"]
