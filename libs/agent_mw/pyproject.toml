[project]
name = "sdo-agent-mw"
version = "0.1.0"
description = "Reusable AgentMiddleware implementations for pydantic-ai agents"
requires-python = ">=3.10"
dependencies = ["sdo-pydantic-agent", "pydantic-ai>=1.0.0"]

[tool.uv.sources]
sdo-pydantic-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/agent_mw"]
