[project]
name = "sdo-operator"
version = "0.1.0"
description = "Self-Defining Operator for autonomous Kubernetes operation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sdo-agent-cli",
    "filelock>=3.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.3",
    "tach>=0.33",
    "pydantic-ai>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.0.0",
    "fastmcp>=2.9.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "tach>=0.33",
]

[project.scripts]
sdo = "sdo.__main__:main"
sdo-detector-check = "controller.builder.check_cli:main"
sdo-memory-check = "sdo.operational_memory.memory_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
sdo-agent-cli = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/agent_cli",
    "libs/sdo_core",
    "libs/pydantic_agent",
    "libs/agent_mw",
    "libs/model_config",
]

[tool.hatch.build.targets.wheel]
packages = ["sdo", "controller"]

[tool.hatch.build.targets.sdist]
include = [
    "/sdo",
    "/controller",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 120
exclude = ["apps/", "bench/", "exp/", "third_party/", "sdo/contracts/_gen/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PIE", "C4", "ERA", "B", "RUF010", "RUF013", "RUF100", "PT", "SIM", "RSE", "FURB", "A", "PERF401", "RET505", "TCH", "S602"]
ignore = ["SIM117", "SIM105", "SIM108", "PT009"]

[tool.ruff.lint.per-file-ignores]
# One-off experiment analysis scripts: hard-coded run paths and ad hoc table formatting.
"benchmarks/sregym/experiments/*/*.py" = ["E501", "E741", "E401", "C408", "C416", "SIM115", "PERF401", "FURB167", "F401", "I001"]

[tool.coverage.run]
source = ["sdo", "controller"]
omit = ["*/apps/*", "*/__main__.py", "*/ui/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["apps", ".venv", "venv", "build", "dist", ".hypothesis"]
markers = [
    "live_agents: opt-in test that invokes live Codex and Claude Code CLI sessions",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6.151.4",
    "pre-commit>=4.2.0",
    "pyright>=1.1.408",
]
