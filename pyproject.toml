[project]
name = "sds-operator"
version = "0.1.0"
description = "Application deployment and monitoring operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=1.1.6",
    "langchain-anthropic>=0.1.20",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.0.5",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "jinja2>=3.1.0",
    "google-adk>=0.1.0",
    "click>=8.0.0",
    "textual>=0.52.0",
    "dspy-ai>=2.4.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "autopep8>=2.0.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
operator = "app_operator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_operator", "lego_agent", "libs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["apps", ".venv", "venv", "build", "dist", ".hypothesis"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
