[project]
name = "sds-operator"
version = "0.1.0"
description = "Application deployment and monitoring operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=1.1.6",
    "langchain-anthropic>=0.1.20",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.0.5",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "jinja2>=3.1.0",
    "google-adk>=0.1.0",
    "click>=8.0.0",
    "textual>=0.52.0",
    "dspy-ai>=2.4.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "tach>=0.33",
    "pydantic-ai>=1.0.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "tach>=0.33",
]

[project.scripts]
operator = "app_operator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["libs/agent_cli", "libs/sds_core", "libs/pydantic_agent"]

[tool.hatch.build.targets.wheel]
packages = ["app_operator", "app_operator_dspy", "lego_agent", "libs"]

[tool.ruff]
line-length = 120
exclude = ["apps/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PIE", "C4", "ERA", "B", "RUF010", "RUF013", "RUF100", "PT", "SIM", "RSE", "FURB", "A", "PERF401", "RET505", "TCH", "S602"]
ignore = ["SIM117", "SIM105", "SIM108", "PT009"]

[tool.coverage.run]
source = ["app_operator", "lego_agent", "libs"]
omit = ["*/apps/*", "*/__main__.py", "*/ui/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["apps", ".venv", "venv", "build", "dist", ".hypothesis"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
]

