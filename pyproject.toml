[project]
name = "sds-operator"
version = "0.1.0"
description = "Application deployment and monitoring operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=1.1.6",
    "langchain-anthropic>=0.1.20",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.0.5",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "jinja2>=3.1.0",
    "google-adk>=0.1.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "autopep8>=2.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
operator = "app_operator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_operator", "agentflow", "libs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["apps", ".venv", "venv", "build", "dist"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
