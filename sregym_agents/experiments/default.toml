# Default SREGym experiment configuration.
#
# Usage:
#   bash scripts/run_sregym.sh sregym_agents/experiments/default.toml  # new run
#   bash scripts/run_sregym.sh bench/sregym/logs/<exp-dir>/        # resume

[runner]
agent = "crucible"
model = "google-vertex:gemini-2.5-flash"
#model = "google_vertexai:gemini-2.5-flash"
parallel = 1
enable_summary = true
no_inject_summary = false
# repeat = 1
# sequence_len = 0
# sequence_seed = 42

# Problem selection (mutually exclusive with [runner.variants]):
#
# Named pre-built set (maps to bench/sregym/sregym/conductor/tasklist.<name>.yml):
# tasklist = "count_train"
#
# Path to a custom tasklist YAML:
# tasklist = "exp_config/sregym/my_tasklist.yml"
#
# Inline list of specific problem IDs (all get diagnosis+mitigation):
# problems = [
#     "faulty_image_correlated",
#     "incorrect_port_assignment",
# ]

[runner.variants]
enabled = true
count = 10
offset = 0
seed = 42
# round_robin = true

[runner.env]
judge_model_id = "vertex-ai-gemini-2.5-pro"
crucible_seed_kb_dir = "/mnt/data/shli/sds/bench/sregym/logs/20260331_012034_crucible_no_kb/kb"
worker_cpu_limit = "16"

# Agent-specific config.
[agent.crucible]
prompt_version = "v3"
enable_judge = false
enable_ltm_retrieval = true
max_hypotheses = 3
max_submissions = 3
kb_type = "structured"
include_benchmark_results = true
enable_heuristic_refinement = true
max_diagnosis_iterations = 3
max_mitigation_iterations = 3
wait_stage_timeout = 300


[agent.crucible_deepagents]
enable_judge = true
enable_ltm_retrieval = true
enable_pipeline = false
max_hypotheses = 5
max_submissions = 5
kb_type = "structured"
include_benchmark_results = true
max_diagnosis_iterations = 5
max_mitigation_iterations = 5
wait_stage_timeout = 300
