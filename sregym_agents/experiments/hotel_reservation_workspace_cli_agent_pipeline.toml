# Two-stage Hotel Reservation pipeline using a persistent application workspace.
#
# Both stages run the same problem list once. Stage 1 reuses the stage 0
# application workspace by copying its artifacts into the stage 1 workspace
# before the benchmark starts.
#
# Usage:
#   bash scripts/run_sregym.sh sregym_agents/experiments/hotel_reservation_workspace_cli_agent_pipeline.toml

[pipeline]
name = "hotel-reservation-workspace-cli-agent"

[defaults]
agent = "cli_agent"
model = "claude-sonnet-4-5"
parallel = 1
repeat = 1
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = true
enable_summary = false
no_inject_summary = true
problems = [
  "missing_service_hotel_reservation",
  "readiness_probe_misconfiguration_hotel_reservation",
  "revoke_auth_mongodb-2",
  "rolling_update_misconfigured_hotel_reservation",
]

[defaults.env]
judge_model_id = "vertex-ai-gemini-2.5-pro"
crucible_seed_kb_dir = ""
worker_cpu_limit = "16"

[defaults.agent_config.cli_agent]
provider = "claude"
timeout_sec = 2000
autonomous_submit = true

[[stages]]
name = "baseline"
chain_kb = false
chain_application_workspace = false

[[stages]]
name = "reuse_workspace"
chain_kb = false
chain_application_workspace = true
