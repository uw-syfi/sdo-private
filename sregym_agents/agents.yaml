agents:
  - name: pydantic_agent
    kickoff_command: uv run python -m sregym_agents.pydantic_agent.driver
    kickoff_workdir: ../..
    kickoff_env:
      PYTHONUNBUFFERED: "1"
  - name: crucible
    kickoff_command: uv run python -m sregym_agents.crucible.driver
    kickoff_workdir: ../..
    kickoff_env:
      PYTHONUNBUFFERED: "1"
    wait_for_natural_exit: true
    # Crucible runs recovery-diagnosis + playbook generation AFTER submitting
    # mitigation. Those steps need the app's namespace to still exist, so
    # sregym must hold teardown (recover_fault + undeploy + reconcile) until
    # the agent explicitly POSTs /cleanup. Without this flag the conductor
    # would tear down synchronously inside the final /submit response, and
    # the reflection agent would see an empty namespace.
    defer_cleanup: true
  - name: cli_agent
    kickoff_command: uv run python -m sregym_agents.cli_agent
    kickoff_workdir: ../..
    kickoff_env:
      PYTHONUNBUFFERED: "1"
    wait_for_natural_exit: true
    # Minimal wrapper around libs/agent_cli. No defer_cleanup: the agent
    # submits and exits; the conductor tears down synchronously.
