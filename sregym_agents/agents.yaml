agents:
  - name: pydantic_agent
    kickoff_command: uv run python -m sregym_agents.pydantic_agent.driver
    kickoff_workdir: ../..
    kickoff_env:
      PYTHONUNBUFFERED: "1"
  - name: crucible
    kickoff_command: uv run python -m sregym_agents.crucible.driver
    kickoff_workdir: ../..
    kickoff_env:
      PYTHONUNBUFFERED: "1"
    wait_for_natural_exit: true
    # Crucible runs recovery-diagnosis + playbook generation AFTER submitting
    # mitigation. Those steps need the app's namespace to still exist, so
    # sregym must hold teardown (recover_fault + undeploy + reconcile) until
    # the agent explicitly POSTs /cleanup. Without this flag the conductor
    # would tear down synchronously inside the final /submit response, and
    # the reflection agent would see an empty namespace.
    defer_cleanup: true
  - name: cli_agent
    kickoff_command: uv run python -m sregym_agents.cli_agent
    kickoff_workdir: ../..
    kickoff_env:
      PYTHONUNBUFFERED: "1"
    # No wait_for_natural_exit: in autonomous-submit mode the wrapped CLI
    # has no terminal signal (submit tools return a neutral ack), so it
    # frequently keeps looping after both submissions. Fall back to
    # sregym's DEFAULT_GRACEFUL_EXIT_TIMEOUT_SECONDS (30s) after the
    # conductor reaches a terminal stage; SIGTERM is sent if the CLI
    # hasn't exited by then.
    # No defer_cleanup: the agent submits and exits; the conductor tears
    # down synchronously.
    before_benchmark: uv run python -m sregym_agents.cli_agent.memory_server start-daemon
    after_benchmark: uv run python -m sregym_agents.cli_agent.memory_server stop-daemon
