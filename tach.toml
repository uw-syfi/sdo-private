exclude = [
    "apps",
    "tests",
]
source_roots = [
    ".",
]
ignore_type_checking_imports = true

# --- Layer 0: libs (no internal deps) ---

[[modules]]
path = "libs.model_config"
depends_on = []

[[modules]]
path = "libs.sdo_core"
depends_on = []

[[modules]]
path = "libs.pydantic_agent"
depends_on = [
    "libs.model_config",
]

[[modules]]
path = "libs.agent_mw"
depends_on = [
    "libs.pydantic_agent",
]

[[modules]]
path = "libs.agent_cli"
depends_on = [
    "libs.sdo_core",
]

[[modules]]
path = "benchmarks.sregym.protocol"
depends_on = []

[[modules]]
path = "controller.builder"
depends_on = []

[[modules]]
path = "sdo.contracts"
depends_on = []

[[modules]]
path = "sdo.operational_memory"
depends_on = [
    "sdo.contracts",
]

[[modules]]
path = "sdo.agent_runtime.lifecycle"
depends_on = [
    "libs.agent_cli",
    "sdo.operational_memory",
]

[[modules]]
path = "sdo.controller_install"
depends_on = [
    "sdo.operational_memory",
    "sdo.contracts",
]

[[modules]]
path = "sdo.agent_runtime.responder"
depends_on = [
    "libs.agent_cli",
    "sdo.operational_memory",
    "sdo.contracts",
]

[[modules]]
path = "benchmarks.sregym.adapter"
depends_on = [
    "benchmarks.sregym.protocol",
    "sdo.agent_runtime.lifecycle",
    "sdo.operational_memory",
    "sdo.controller_install",
]

[[modules]]
path = "benchmarks.sregym.fastloop"
depends_on = [
    "benchmarks.sregym.adapter",
    "sdo.agent_runtime.lifecycle",
    "sdo.controller_install",
]

[[modules]]
path = "benchmarks.sregym.runner"
depends_on = [
    "benchmarks.sregym.protocol",
]

[[modules]]
path = "benchmarks.sregym.run"
depends_on = [
    "benchmarks.sregym.runner",
]

[[modules]]
path = "sdo.operation"
depends_on = [
    "sdo.agent_runtime.lifecycle",
    "sdo.controller_install",
]

[[modules]]
path = "sdo.__main__"
depends_on = [
    "sdo.operation",
]

# --- Benchmark agents (independent of production sdo) ---

[[modules]]
path = "benchmarks.sregym.agents"
depends_on = [
    "libs.pydantic_agent",
    "libs.agent_mw",
    "libs.agent_cli",
]
