exclude = [
    "apps",
    "tests",
]
source_roots = [
    ".",
]
ignore_type_checking_imports = true

# --- Layer 0: libs (no internal deps) ---

[[modules]]
path = "libs.model_config"
depends_on = []

[[modules]]
path = "libs.sdo_core"
depends_on = []

[[modules]]
path = "libs.pydantic_agent"
depends_on = [
    "libs.model_config",
]

[[modules]]
path = "libs.agent_mw"
depends_on = [
    "libs.pydantic_agent",
]

[[modules]]
path = "libs.agent_cli"
depends_on = [
    "libs.sdo_core",
]

[[modules]]
path = "libs.sregym_lib"
depends_on = []

[[modules]]
path = "controller.builder"
depends_on = []

[[modules]]
path = "app_operator.protocol"
depends_on = []

[[modules]]
path = "app_operator.memory"
depends_on = [
    "app_operator.protocol",
]

[[modules]]
path = "app_operator.lifecycle"
depends_on = [
    "app_operator.memory",
]

[[modules]]
path = "app_operator.runtime"
depends_on = [
    "app_operator.memory",
    "app_operator.protocol",
]

[[modules]]
path = "app_operator.responder"
depends_on = [
    "app_operator.memory",
    "app_operator.protocol",
]

[[modules]]
path = "app_operator.sdo_sregym"
depends_on = [
    "app_operator.lifecycle",
    "app_operator.memory",
    "app_operator.runtime",
    "libs.sregym_lib",
]

[[modules]]
path = "app_operator.operation"
depends_on = [
    "app_operator.lifecycle",
    "app_operator.runtime",
]

[[modules]]
path = "app_operator.__main__"
depends_on = [
    "app_operator.operation",
]

# --- sregym_agents (independent of app_operator) ---

[[modules]]
path = "sregym_agents"
depends_on = [
    "libs.pydantic_agent",
    "libs.agent_mw",
    "libs.agent_cli",
    "libs.sregym_lib",
]
