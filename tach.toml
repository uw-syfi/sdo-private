exclude = [
    "apps",
    "tests",
]
source_roots = [
    ".",
]
ignore_type_checking_imports = true

# --- Layer 0: libs (no internal deps) ---

[[modules]]
path = "libs.model_config"
depends_on = []

[[modules]]
path = "libs.sds_core"
depends_on = []

[[modules]]
path = "libs.pydantic_agent"
depends_on = [
    "libs.model_config",
]

[[modules]]
path = "libs.agent_mw"
depends_on = [
    "libs.pydantic_agent",
]

[[modules]]
path = "libs.sregym_lib"
depends_on = []

[[modules]]
path = "libs.llm_rt"
depends_on = []

[[modules]]
path = "observer.updater"
depends_on = []

# --- app_operator catch-all (strict tripwire) ---
# Any app_operator.* path not matched by a more specific [[modules]] block
# below falls into this catch-all.  With `depends_on = []` it acts as a
# tripwire:
#   1. libs/ and lego_agent/ cannot import from *any* app_operator.* path,
#      including newly-added files that no one has classified yet (that is
#      the robustness property).
#   2. Any top-level app_operator file with internal dependencies MUST be
#      declared as its own module at the correct layer below.  Dropping a
#      new top-level file that reaches into a subpackage without declaring
#      its layer will fail `tach check`.

[[modules]]
path = "app_operator"
depends_on = []

# --- app_operator Layer 0: foundation package ---
# `app_operator.core` consolidates the former top-level foundation files
# (config, logger, exceptions, filesystem, types, validation, constants,
# command_validation) into a single coherent package with a
# curated public surface in `app_operator/core/__init__.py`.

[[modules]]
path = "app_operator.core"
depends_on = [
    "libs.model_config",
    "libs.sds_core",
]

# --- app_operator Layer 0: pure foundation files (no internal deps) ---

[[modules]]
path = "app_operator.experiment_naming"
depends_on = []

[[modules]]
path = "app_operator.agent_runner"
depends_on = []

[[modules]]
path = "app_operator.repo_evidence"
depends_on = []

[[modules]]
path = "app_operator.run_classifier"
depends_on = []

[[modules]]
path = "app_operator.subprocess_runner"
depends_on = []

# --- app_operator Layer 1: composes Layer 0 ---

[[modules]]
path = "app_operator.llm"
