<!DOCTYPE html>
<html>
<head>
    <title>Hotel Search</title>
</head>
<body>
    <h1>Hotel Search</h1>
    <label for="inDate">Check-in Date:</label>
    <input type="date" id="inDate" name="inDate">
    <label for="outDate">Check-out Date:</label>
    <input type="date" id="outDate" name="outDate">
    <br>
    <label for="lat">Latitude:</label>
    <input type="text" id="lat" name="lat">
    <label for="lon">Longitude:</label>
    <input type="text" id="lon" name="lon">
    <br>
    <button onclick="searchHotels()">Search</button>
    <div id="hotels"></div>

    <script>
        function searchHotels() {
            const inDate = document.getElementById('inDate').value;
            const outDate = document.getElementById('outDate').value;
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;

            const url = `/hotels?inDate=${inDate}&outDate=${outDate}&lat=${lat}&lon=${lon}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const hotelsDiv = document.getElementById('hotels');
                    hotelsDiv.innerHTML = ''; // Clear previous results
                    if (data.hotels) {
                        data.hotels.forEach(hotel => {
                            const hotelDiv = document.createElement('div');
                            hotelDiv.innerHTML = `
                                <h2>${hotel.name}</h2>
                                <p>Rate: ${hotel.rate}</p>
                                <p>Room Amenities: ${hotel.room_amenities}</p>
                            `;
                            hotelsDiv.appendChild(hotelDiv);
                        });
                    } else {
                        hotelsDiv.innerHTML = '<p>No hotels found.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching hotels:', error);
                    const hotelsDiv = document.getElementById('hotels');
                    hotelsDiv.innerHTML = '<p>Error fetching hotels. Please try again.</p>';
                });
        }
    </script>
</body>
</html>
