# Baseline Experiment Configuration (FilteredCodingAgent)
#
# This file configures the end-to-end prompt optimization loop for the
# filtered-log baseline agent.  Same structure as e2e_config_rlm1.toml but
# uses the "filtered" provider instead of "rlm".
#
# Usage: uv run -m app_operator e2e-optimize --config e2e_config_baseline.toml

# Number of optimization iterations
iterations = 3

# Provider override — each experiment dir's sds.toml will use this provider
# instead of whatever the root sds.toml says.
provider = "filtered"

# Output prefix for optimized prompt directories (writes to optimized/baseline/v{n}/)
output_prefix = "baseline"

# Working directory for experiment state and run artifacts
work_dir = "e2e_optimization_baseline"

# Prompts to optimize (choose from available prompts - see docs/dspy-optimization.md)
prompts = ["deployer_fix_error", "deployer_summarize"]

# Rate limiting and retry configuration
inter_run_delay = 30
max_retries = 3
rate_limit_backoff = 60

[training]
# Applications to use for training (generating trajectories for optimization)
apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/socialNetwork",
]

[validation]
# Applications to use for validation (testing optimized prompts)
apps = [
    "apps/fleetcast",
]
