apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdo-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdo-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  # The isolated synthetic-traffic prober pod and its NetworkPolicy.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sdo-controller
subjects:
  - kind: ServiceAccount
    name: sdo-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdo-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdo-responder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdo-responder
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sdo-responder
subjects:
  - kind: ServiceAccount
    name: sdo-responder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdo-responder
