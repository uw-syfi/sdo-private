apiVersion: batch/v1
kind: Job
metadata:
  name: sdo-detector-validator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdo-detector-validator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validator
          image: sdo-detector-validator:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "controller.builder.check_cli"]
          args: ["test", "--app", "/workspace"]
          env:
            - name: HOME
              value: /tmp
            - name: GOCACHE
              value: /tmp/go-cache
            - name: GOMODCACHE
              value: /go/pkg/mod
            - name: GOPROXY
              value: "off"
            - name: GOSUMDB
              value: "off"
            - name: GOMAXPROCS
              value: "2"
            - name: GOFLAGS
              value: -p=2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          volumeMounts:
            - name: application
              mountPath: /workspace
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: application
          persistentVolumeClaim:
            claimName: sdo-application-repository
            readOnly: true
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 3Gi
