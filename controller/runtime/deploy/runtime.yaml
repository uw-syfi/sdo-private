apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdo-application-repository
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdo-controller
  labels:
    app.kubernetes.io/name: sdo-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sdo-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdo-controller
    spec:
      serviceAccountName: sdo-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: sdo-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          command: [python3, -m, controller.builder.check_cli]
          args:
            - controller
            - --app
            - /workspace/application
            - --namespace
            - default
            - --responder-image
            - sdo-responder:v0.1.0
            - --repository-pvc
            - sdo-application-repository
            - --repository-mount-path
            - /workspace
            - --credentials-secret
            - sdo-codex-credentials
            - --worktree-root
            - /workspace/worktrees
            - --responder-env=CODEX_HOME=/workspace/.sdo-runtime/codex
            - --broker-arg=-m
            - --broker-arg=app_operator.responder.broker_cli
            - --broker-arg=--proposal-command
            - --broker-arg=git diff --check HEAD --
            - --broker-arg=--validator-mode
            - --broker-arg=kubernetes
            - --broker-arg=--validator-namespace
            - --broker-arg=default
            - --broker-arg=--validator-image
            - --broker-arg=sdo-detector-validator:v0.1.0
            - --broker-arg=--validator-repository-pvc
            - --broker-arg=sdo-application-repository
            - --broker-arg=--validator-repository-mount-path
            - --broker-arg=/workspace
            - --broker-arg=--responder-model
            - --broker-arg=gpt-5
            - --broker-arg=--reflection-model
            - --broker-arg=gpt-5
          envFrom:
            - secretRef:
                name: sdo-codex-credentials
          env:
            - {name: CODEX_HOME, value: /workspace/.sdo-runtime/codex}
            - {name: GIT_AUTHOR_NAME, value: sdo-controller}
            - {name: GIT_AUTHOR_EMAIL, value: sdo-controller@invalid}
            - {name: GIT_COMMITTER_NAME, value: sdo-controller}
            - {name: GIT_COMMITTER_EMAIL, value: sdo-controller@invalid}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: repository, mountPath: /workspace}
            - {name: scratch, mountPath: /tmp}
            - {name: credentials, mountPath: /sdo/credentials, readOnly: true}
      volumes:
        - name: repository
          persistentVolumeClaim:
            claimName: sdo-application-repository
        - name: scratch
          emptyDir:
            sizeLimit: 4Gi
        - name: credentials
          secret:
            secretName: sdo-codex-credentials
