image: python:3.11

workflow:
  rules:
    # Run on push to main
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Prevent duplicate pipelines for branches with open MRs
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    # Optional: Run on other branches if needed, but user specifically asked for PR/Main logic.
    # Allowing other branches helps catching issues before PR.
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test

test_job:
  stage: test
  before_script:
    - pip install uv
    - uv sync --all-extras
  script:
    - echo "Running Static Error Checks..."
    - ./scripts/check_errors.sh
    
    - echo "Checking Code Formatting..."
    - ./scripts/format_code.sh --check
    
    - echo "Running Tests..."
    - ./scripts/run_tests.sh