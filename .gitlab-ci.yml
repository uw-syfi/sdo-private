image: python:3.12

workflow:
  rules:
    # Run on push to main
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Prevent duplicate pipelines for branches with open MRs
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    # Optional: Run on other branches
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - test

# Define a global cache for uv's internal files to speed up installs across runs
variables:
  UV_CACHE_DIR: ".uv-cache"

cache:
  key: "uv-global-cache"
  paths:
    - .uv-cache/

setup:
  stage: build
  script:
    - pip install uv
    - echo "Installing dependencies..."
    - uv sync --all-extras
  artifacts:
    paths:
      - .venv/
    expire_in: 1 hour

.test_job_template:
  stage: test
  before_script:
    - pip install uv
  dependencies:
    - setup

static_analysis:
  extends: .test_job_template
  script:
    - echo "Running Static Error Checks..."
    - ./scripts/check_errors.sh

formatting:
  extends: .test_job_template
  script:
    - echo "Checking Code Formatting..."
    - ./scripts/format_code.sh --check

python_unit_tests:
  extends: .test_job_template
  script:
    - echo "Running Python Tests..."
    - ./scripts/run_tests.sh --python-only

js_unit_tests:
  stage: test
  image: node:20
  script:
    - echo "Running JS Tests..."
    - ./scripts/run_tests.sh --js-only