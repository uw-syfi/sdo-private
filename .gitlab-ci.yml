image: python:3.12

workflow:
  rules:
    # Run on push to main
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Prevent duplicate pipelines for branches with open MRs
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    # Optional: Run on other branches
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - test

# Define a global cache for uv's internal files to speed up installs across runs
variables:
  UV_CACHE_DIR: ".uv-cache"

cache:
  key: "uv-global-cache"
  paths:
    - .uv-cache/

setup:
  stage: build
  script:
    - pip install uv
    - echo "Installing dependencies..."
    - uv sync --all-extras
  artifacts:
    paths:
      - .venv/
    expire_in: 1 hour

.test_job_template:
  stage: test
  before_script:
    - pip install uv
  dependencies:
    - setup

static_analysis:
  extends: .test_job_template
  script:
    - echo "Running Static Error Checks..."
    - ./scripts/check_errors.sh

type_check:
  extends: .test_job_template
  script:
    - echo "Running Type Checks..."
    - ./scripts/type_check.sh

formatting:
  extends: .test_job_template
  script:
    - echo "Checking Code Formatting..."
    - ./scripts/format_code.sh --check

unit_tests_python:
  extends: .test_job_template
  script:
    - echo "Running Python Tests..."
    - ./scripts/test_python.sh
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'

unit_tests_js:
  stage: test
  image: node:20
  script:
    - echo "Running Frontend Tests..."
    - ./scripts/test_js.sh

architecture_check:
  extends: .test_job_template
  script:
    - echo "Checking architecture rules..."
    - ./scripts/check_arch.sh

tach_graph_freshness:
  extends: .test_job_template
  script:
    - apt-get update -qq && apt-get install -y -qq graphviz >/dev/null
    - echo "Regenerating tach module graph..."
    - ./scripts/generate_tach_graph.sh
    - >-
      git diff --exit-code docs/assets/tach_module_graph.dot ||
      (echo "ERROR: docs/assets/tach_module_graph.dot is out of date. Run scripts/generate_tach_graph.sh and commit the result." && exit 1)
