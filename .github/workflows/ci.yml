name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit (the tag it was taken from is in the
# comment), and uv installs exactly uv.lock.
jobs:
  python:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static analysis
            run: ./scripts/check_errors.sh
          - name: type check
            run: ./scripts/type_check.sh
          - name: formatting
            run: ./scripts/format_code.sh --check
          - name: architecture
            run: ./scripts/check_arch.sh
          - name: unit tests
            run: ./scripts/test_python.sh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out the SREGym harness
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/sregym
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: ${{ matrix.run }}

  controller:
    name: controller (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [sdk, core, runtime]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.5"
          cache-dependency-path: controller/${{ matrix.module }}/go.sum
      - run: go test -race ./...
        working-directory: controller/${{ matrix.module }}

  # Proto contracts are the single source of truth for the cross-seam types
  # (docs/seam-contracts-decisions.md). This job lints the .proto source, checks
  # it stays wire-compatible with main, and asserts the committed Go/Python
  # codegen matches `buf generate` — so schema drift is a build failure here.
  proto:
    name: proto contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # buf breaking compares against the main branch
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.5"
      - name: Install the proto toolchain
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
      - name: Ensure main is available for breaking detection
        run: git fetch --no-tags origin main:main || echo "main unavailable; breaking check will skip"
      - name: Lint, breaking, and codegen-diff checks
        run: ./scripts/check_proto.sh
      - name: Build the generated Go contracts module
        run: go build ./...
        working-directory: controller/contracts

  # Builds the images SDO runs in and checks each one imports its entry points
  # (SDO, agentshim, the benchmark submission client) at the pinned Codex CLI
  # and agentshim versions, so a broken image fails here and not mid-experiment.
  images:
    name: controller images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out the SREGym harness
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/sregym
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Build the SDO images and smoke-run the benchmark responder
        run: ./scripts/build_sdo_images.sh
      - name: Probe the SDO images against the pins
        run: |
          uv run python -m benchmarks.sregym.runner.preflight \
            --image controller_image=sdo-controller:v0.1.0 \
            --image responder_image=sdo-sregym-responder:v0.1.0 \
            --image validator_image=sdo-detector-validator:v0.1.0
          uv run python -m benchmarks.sregym.runner.preflight \
            --image responder_image=sdo-responder:v0.1.0
      - name: Confirm the responder image carries no SREGym answer key
        # Belt-and-braces over tests/unit/controller/test_dockerfile_benchmark_scope.py,
        # which checks the Dockerfile COPY lines statically: this lists the files an
        # actually built image carries, so a leak would fail here even if some other
        # build step (a base image, a stray COPY --from) reintroduced one.
        run: |
          files="$(docker run --rm --entrypoint find sdo-sregym-responder:v0.1.0 /opt/sdo/benchmarks -type f)"
          echo "${files}"
          leaked="$(echo "${files}" | grep -E '/(experiments|assurance|fastloop|analysis|runner|agents)/|/docs/|/tests/|/sdo_paper/' || true)"
          if [ -n "${leaked}" ]; then
            echo "answer-key paths present in sdo-sregym-responder:v0.1.0:" >&2
            echo "${leaked}" >&2
            exit 1
          fi
