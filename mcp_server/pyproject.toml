[project]
name = "mcp-server"
version = "0.1.0"
description = "SDS Controller MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.60.0",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
mcp-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
