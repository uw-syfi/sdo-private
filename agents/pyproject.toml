[project]
name = "sds-operator"
version = "0.1.0"
description = "Application deployment and monitoring operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
operator = "app_operator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_operator"]
