[agent]
provider = "codex" # or "gemini", "claude", "opencode", "openai", "anthropic"
# model = "gpt-4o-mini" # required for langgraph runtime
# location = "us-central1" # optional: specify vertex AI location (default: us-central1)

[runtime]
impl = "cli_agent" # or "langgraph", "adk"

[operator]
interval = 30
monitoring_max_iters = 5 # Maximum number of health monitoring iterations
deployment_max_iters = 20 # Maximum deployment attempts

[deployment]
platform = "docker" # "docker" or "k8s"
target = "local" # "local" or "remote"
