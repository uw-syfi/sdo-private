# Example E2E Optimization Configuration
#
# This file configures the end-to-end prompt optimization loop.
# Usage: uv run -m app_operator e2e-optimize --config e2e_config.toml

# Number of optimization iterations
iterations = 3

# Prompts to optimize (choose from available prompts - see docs/dspy-optimization.md)
prompts = ["deployer_fix_error", "deployer_summarize"]

# Rate limiting and retry configuration
# These settings help prevent API quota exhaustion during long experiment runs
inter_run_delay = 30         # Delay between consecutive runs in seconds (default: 30)
                             # Increase to 60+ if you encounter rate limits
max_retries = 3              # Max retries per failed run (default: 3)
rate_limit_backoff = 60      # Additional delay when rate limit detected (default: 60)

[training]
# Applications to use for training (generating trajectories for optimization)
apps = [
    "apps/deathstarbench/hotelReservation",
    "apps/deathstarbench/mediaMicroservices",
]

[validation]
# Applications to use for validation (testing optimized prompts)
# Optional - can be omitted if you don't want separate validation
apps = [
    "apps/deathstarbench/socialNetwork",
]
